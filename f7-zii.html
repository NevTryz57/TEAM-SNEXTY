<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>F7 • Zii — TEAM SNEXTY</title>
<link rel="stylesheet" href="style.css">

<style>
body{
  margin:0;
  background:#020814;
  color:white;
  font-family:Arial,sans-serif;
}

.profile-page{
  min-height:100vh;
  padding:35px 7%;
}

.back{
  display:inline-block;
  margin-bottom:30px;
  color:#8ec7ff;
  text-decoration:none;
  font-weight:bold;
}

.profile{
  max-width:1000px;
  margin:auto;
  overflow:hidden;
  border-radius:24px;
  border:1px solid rgba(80,160,255,.25);
  background:#061426;
  box-shadow:0 0 50px rgba(0,100,255,.15);
}

.profile-head{
  padding:45px;
  background:linear-gradient(135deg,#06356b,#020814);
}

.profile-head small{
  color:#6db0ff;
  letter-spacing:3px;
}

.profile-head h1{
  margin:12px 0 5px;
  font-size:clamp(40px,8vw,75px);
}

.role{
  color:#9bb8d5;
}

.content{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  padding:30px;
}

.box{
  padding:25px;
  border-radius:17px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
}

.box h2{
  color:#70b3ff;
  margin-top:0;
}

.stat{
  display:flex;
  justify-content:space-between;
  padding:14px 0;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.stat:last-child{
  border-bottom:0;
}

@media(max-width:700px){
  .content{
    grid-template-columns:1fr;
    padding:18px;
  }
}
</style>
</head>

<body>

<main class="profile-page">

<a href="index.html" class="back">
← KEMBALI KE ROSTER
</a>

<section class="profile">

<div class="profile-head">

</div>

</div>

<div class="content">

<h2>PROFILE ML</h2>

<div class="stat">
<span>Nickname</span>
<strong>F7 • Zii</strong>
</div>

<div class="stat">

<strong>GOLD LANER</strong>
</div>

<div class="stat">

<strong>TEAM SNEXTY</strong>
</div>

<div class="stat">
<span>Game</span>
<strong>Mobile Legends</strong>
</div>

</div>

<div class="box">

<h2>PLAYER INFO</h2>

<div class="stat">
<span>Hero Favorit</span>
<strong>—</strong>
</div>

<div class="stat">

<strong>—</strong>
</div>

<div class="stat">
<span>Win Rate</span>
<strong>—</strong>
</div>

<div class="stat">

<strong>—</strong>
</div>

</div>

</div>

</section>

</main>

</body>
</html>
